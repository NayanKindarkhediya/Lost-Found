<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Lost & Found</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="login-wrapper">
    <div class="login-card">
      <div class="login-icon"><img src="All img/login 2.png"></div>
      <h2>Welcome Back</h2>
      <p class="login-sub">Login to continue</p>

      <label>Email Address</label>
      <input type="email" id="email" class="login-input-email" placeholder="name@example.com" />
      <p id="emailError" style="color:red; font-size:13px;"></p>

      <label>Password</label>

      <div class="password-box">
        <input type="password" id="password" class="login-input-pass" placeholder="Enter your password" />

        <span onclick="togglePassword('password')" class="eye-icon">
          <img id="eye-password" src="All img/eye.png" width="20">
        </span>
      </div>

      <p id="passError" style="color:red; font-size:13px;"></p>

      <button class="login-btn" id="loginBtn">Continue</button>

      <a href="#" class="forgot">Forgot Password?</a>

      <p class="signup-text">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </section>

  <script>
    document.getElementById("loginBtn").addEventListener("click", function () {
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value;

      let emailError = document.getElementById("emailError");
      let passError = document.getElementById("passError");

      emailError.textContent = "";
      passError.textContent = "";

      let valid = true;

      if (!email.includes("@") || !email.includes(".")) {
        emailError.textContent = "Enter a valid email!";
        valid = false;
      }

      if (password.length < 6) {
        passError.textContent = "Password must be at least 6 characters!";
        valid = false;
      }

      if (valid) {
        // --- old local code comment ---
        /*
        localStorage.setItem("loggedIn", "true");
        window.location.href = "home.html";
        */

        // --- Naya Backend Fetch code ---
        const loginData = { email: email, password: password };

        fetch('http://localhost:5000/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(loginData)
        })
        .then(res => res.json())
        .then(data => {
             if (data.success) {
    alert("Login Successful!");
    
    const user = data.user; 

    // User details save kar rahe hain
    localStorage.setItem("userEmail", user.email);
    localStorage.setItem("fullName", user.fullname); 
    localStorage.setItem("phone", user.phone);
    localStorage.setItem("loggedIn", "true");

    // PHOTO FIX: 
    // Agar pehle se koi profile photo nahi hai (naye login par), 
    // toh ek default placeholder set kar do taaki error na aaye.
         if (!localStorage.getItem("profileImage")) {
          localStorage.setItem("profileImage", "All img/default-avatar.png"); // Aapka default avatar path
    }

    window.location.href = "Home.html";
    } else {
             alert("Error: " + data.message);
           }  
        })
        .catch(err => {
            console.error("Error:", err);
            alert("Server Error! Check if server.js is running.");
        });
      }
    }); // <--- for backend
    // Passworld show 

    function togglePassword(id) {
      let input = document.getElementById(id);
      let eyeIcon = document.getElementById("eye-" + id);

      if (input.type === "password") {
        input.type = "text";
        eyeIcon.src = "All img/hidden.png";   // closed eye
      } else {
        input.type = "password";
        eyeIcon.src = "All img/eye.png";      // open eye
      }
    }
   </script>
  </body>

</html>
